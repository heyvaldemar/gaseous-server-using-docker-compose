# Image pins live HERE, as interpolation defaults, so `git pull` (or
# re-downloading this file) delivers the exact version combination this
# repository has tested — no .env editing required. Setting the matching
# variable in .env overrides the default for anyone who wants to pin
# differently; .env itself carries only secrets and deliberate overrides.
# CI (Trivy scans, check-pin-freshness, the ephemeral test .env) reads
# the pins from these lines — this block is the single source of truth.
x-images:
  traefik: &traefik-image ${TRAEFIK_IMAGE_TAG:-traefik:3.7@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259}
  mariadb: &mariadb-image ${GASEOUS_SERVER_MARIADB_IMAGE_TAG:-mariadb:11.4@sha256:80494b9810694179889f7281ec44ca928241df577159c0356a1070e2e94616a1}
  gaseous: &gaseous-image ${GASEOUS_SERVER_IMAGE_TAG:-gaseousgames/gaseousserver:v1.7.14@sha256:5e506593ff09533f23e742470da2ef37ffe4051f3559dad3b038e81444df75a6}

networks:
  gaseous-server-network:
    external: true
  traefik-network:
    external: true

volumes:
  mariadb-data:
  gaseous-server-data:
  gaseous-server-mariadb-backup:
  gaseous-server-data-backups:
  gaseous-server-database-backups:
  traefik-certificates:

services:
  mariadb:
    image: *mariadb-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only what this image's entrypoint
    # needs (chown its data directory and drop to its service user).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # Docker's default is ten seconds, then SIGKILL. MariaDB has InnoDB to
    # flush on the way out; killed halfway, the next start does crash
    # recovery. Sixty seconds, overridable in .env.
    stop_grace_period: ${GASEOUS_SERVER_MARIADB_STOP_GRACE_PERIOD:-60s}
    # Resource limits as .env-overridable defaults (e.g. GASEOUS_SERVER_MARIADB_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${GASEOUS_SERVER_MARIADB_MEMORY_LIMIT:-1g}
          cpus: "${GASEOUS_SERVER_MARIADB_CPU_LIMIT:-1.0}"
        reservations:
          memory: ${GASEOUS_SERVER_MARIADB_MEMORY_RESERVATION:-128m}
          cpus: "${GASEOUS_SERVER_MARIADB_CPU_RESERVATION:-0.25}"
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: gaseous
      MARIADB_USER: ${GASEOUS_SERVER_DB_USER:-gaseousdbuser}
      MARIADB_PASSWORD: ${GASEOUS_SERVER_DB_PASSWORD:?set in .env - see .env.example for generation command}
      MARIADB_ROOT_PASSWORD: ${GASEOUS_SERVER_DB_ADMIN_PASSWORD:?set in .env - see .env.example for generation command}
    networks:
      - gaseous-server-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  gaseous-server:
    image: *gaseous-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. GASEOUS_SERVER_MEMORY_LIMIT=2g);
    # the override survives every git pull.
    deploy:
      resources:
        limits:
          memory: ${GASEOUS_SERVER_MEMORY_LIMIT:-2g}
          cpus: "${GASEOUS_SERVER_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${GASEOUS_SERVER_MEMORY_RESERVATION:-256m}
          cpus: "${GASEOUS_SERVER_CPU_RESERVATION:-0.25}"
    volumes:
      - gaseous-server-data:${DATA_PATH:-/root/.gaseous-server}
    environment:
      dbhost: mariadb
      dbuser: ${GASEOUS_SERVER_DB_USER:-gaseousdbuser}
      dbpass: ${GASEOUS_SERVER_DB_PASSWORD}
      igdbclientid: ${GASEOUS_SERVER_IGDB_CLIENT_ID:-}
      igdbclientsecret: ${GASEOUS_SERVER_IGDB_CLIENT_SECRET:-}
      TZ: ${GASEOUS_SERVER_TIMEZONE:-America/New_York}
    networks:
      - gaseous-server-network
      - traefik-network
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 360s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Match incoming requests on a specific hostname
      - "traefik.http.routers.gaseous-server.rule=Host(`${GASEOUS_SERVER_HOSTNAME:?set in .env - see .env.example}`)"
      # Assign the router to a named Traefik service
      - "traefik.http.routers.gaseous-server.service=gaseous-server"
      # Use the 'websecure' (HTTPS) entry point
      - "traefik.http.routers.gaseous-server.entrypoints=websecure"
      # Define the internal container port for routing
      - "traefik.http.services.gaseous-server.loadbalancer.server.port=80"
      # Enable TLS on this router
      - "traefik.http.routers.gaseous-server.tls=true"
      # Use Let's Encrypt for certificate management
      - "traefik.http.routers.gaseous-server.tls.certresolver=letsencrypt"
      # Pass the original Host header to the container
      - "traefik.http.services.gaseous-server.loadbalancer.passhostheader=true"
      # Apply a compression middleware
      - "traefik.http.routers.gaseous-server.middlewares=compresstraefik"
      # Define settings for the compression middleware
      - "traefik.http.middlewares.compresstraefik.compress=true"
      # Specify which Docker network Traefik should use for routing
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: *traefik-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    # Drop every Linux capability; add back only the one a proxy needs to bind
    # :80 and :443 as a non-root user.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: ${TRAEFIK_MEMORY_LIMIT:-256m}
          cpus: "${TRAEFIK_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${TRAEFIK_MEMORY_RESERVATION:-64m}
          cpus: "${TRAEFIK_CPU_RESERVATION:-0.1}"
    command:
      # Set the log level (DEBUG, INFO, WARN, ERROR)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      # Enable the built-in API and web-based dashboard
      - "--api.dashboard=true"
      # Enable the /ping endpoint so we can health-check Traefik
      - "--ping=true"
      # Assign the /ping endpoint to a dedicated entry point on port 8082
      - "--ping.entrypoint=ping"
      - "--entrypoints.ping.address=:8082"
      # Define the primary HTTP entry point on port 80
      - "--entrypoints.web.address=:80"
      # Define the secure (HTTPS) entry point on port 443
      - "--entrypoints.websecure.address=:443"
      # HTTP -> HTTPS redirect at entrypoint level
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Enable the Docker provider to detect containers and their labels
      - "--providers.docker=true"
      # Point Traefik to the Docker socket
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Prevent automatic exposure of all containers; only expose containers
      # with "traefik.enable=true"
      - "--providers.docker.exposedbydefault=false"
      # Use ACME (Let's Encrypt) to generate/renew certificates via TLS challenge
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      # The email address used by Let's Encrypt for renewal notices
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?set in .env - see .env.example}"
      # The file where ACME certificates are stored inside the container
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      # Enable Prometheus metrics
      - "--metrics.prometheus=true"
      # Configure Prometheus histogram buckets
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      # Check for newer Traefik versions and optionally log that info
      - "--global.checknewversion=true"
      # Disable sending anonymous usage data to the Traefik maintainers
      - "--global.sendanonymoususage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # A router to expose the Traefik dashboard
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME:?set in .env - see .env.example}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      # Basic Authentication for the Traefik dashboard
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH:?set in .env - see .env.example for htpasswd generation}"
      # Specify the internal server port to the dashboard service
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # Pass the original Host header to the backend
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
    restart: unless-stopped

  backups:
    image: *mariadb-image
    # Hardening: no privilege escalation via setuid binaries
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          memory: ${GASEOUS_SERVER_BACKUPS_MEMORY_LIMIT:-256m}
          cpus: "${GASEOUS_SERVER_BACKUPS_CPU_LIMIT:-0.5}"
        reservations:
          memory: ${GASEOUS_SERVER_BACKUPS_MEMORY_RESERVATION:-32m}
          cpus: "${GASEOUS_SERVER_BACKUPS_CPU_RESERVATION:-0.1}"
    # The loop reports every outcome and never lets a failure look like a
    # success. Three things it gets right that the previous version did not:
    #   - `bash -c` with `set -o pipefail`, so a mariadb-dump error fails the
    #     pipeline. Under plain `sh` the exit status is gzip's, and gzip is
    #     perfectly happy compressing an error message into a valid archive.
    #   - each outcome is logged with a timestamp and a byte count, so a
    #     backup that stopped working is visible in `docker logs`.
    #   - every file is written to <name>.partial and renamed once the write
    #     succeeded, so the real name never exists unless the file is whole.
    command: >-
      bash -c 'set -o pipefail;
      sleep "$$BACKUP_INIT_SLEEP";
      while true; do
        STAMP="$$(date +%Y-%m-%d_%H-%M)";
        DB_FILE="$$MARIADB_BACKUPS_PATH/$$MARIADB_BACKUP_NAME-$$STAMP.gz";
        echo "[$$(date -Iseconds)] Starting database backup to $$DB_FILE";
        if mariadb-dump -h mariadb -u $$GASEOUS_SERVER_DB_USER -p"$$GASEOUS_SERVER_DB_PASSWORD" gaseous | gzip > "$$DB_FILE.partial"; then
          mv "$$DB_FILE.partial" "$$DB_FILE";
          echo "[$$(date -Iseconds)] Database backup OK: $$DB_FILE ($$(stat -c %s "$$DB_FILE") bytes)";
        else
          echo "[$$(date -Iseconds)] Database backup FAILED - partial file kept as $$DB_FILE.failed for diagnosis" >&2;
          mv "$$DB_FILE.partial" "$$DB_FILE.failed" 2>/dev/null || true;
        fi;
        DATA_FILE="$$DATA_BACKUPS_PATH/$$DATA_BACKUP_NAME-$$STAMP.tar.gz";
        echo "[$$(date -Iseconds)] Starting data backup to $$DATA_FILE";
        # GNU tar exits 1 when a live application changed a file mid-read;
        # the archive is complete - only exit 2 is a real failure. No GNU-only
        # flags: alpine images ship BusyBox tar.
        tar -zcpf "$$DATA_FILE.partial" $$DATA_PATH; RC=$$?;
        if [ "$$RC" -eq 0 ] || [ "$$RC" -eq 1 ]; then
          mv "$$DATA_FILE.partial" "$$DATA_FILE";
          echo "[$$(date -Iseconds)] Data backup OK: $$DATA_FILE ($$(stat -c %s "$$DATA_FILE") bytes)$$([ "$$RC" -eq 1 ] && echo " - some files changed while being read")";
        else
          echo "[$$(date -Iseconds)] Data backup FAILED - partial file kept as $$DATA_FILE.failed for diagnosis" >&2;
          mv "$$DATA_FILE.partial" "$$DATA_FILE.failed" 2>/dev/null || true;
        fi;
        if [ "$${MARIADB_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$MARIADB_BACKUPS_PATH" -type f -name "$$MARIADB_BACKUP_NAME-*" -mtime "+$$MARIADB_BACKUP_PRUNE_DAYS" -delete;
        fi;
        if [ "$${DATA_BACKUP_PRUNE_DAYS:-0}" -ge 1 ]; then
          find "$$DATA_BACKUPS_PATH" -type f -name "$$DATA_BACKUP_NAME-*" -mtime "+$$DATA_BACKUP_PRUNE_DAYS" -delete;
        fi;
        sleep "$$BACKUP_INTERVAL";
      done'
    volumes:
      - gaseous-server-mariadb-backup:/var/lib/mysql
      - gaseous-server-data:${DATA_PATH:-/root/.gaseous-server}
      - gaseous-server-data-backups:${DATA_BACKUPS_PATH:-/srv/gaseous-application-data/backups}
      - gaseous-server-database-backups:${MARIADB_BACKUPS_PATH:-/srv/gaseous-mariadb/backups}
    environment:
      GASEOUS_SERVER_DB_USER: ${GASEOUS_SERVER_DB_USER:-gaseousdbuser}
      GASEOUS_SERVER_DB_PASSWORD: ${GASEOUS_SERVER_DB_PASSWORD}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP:-30m}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      MARIADB_BACKUP_PRUNE_DAYS: ${MARIADB_BACKUP_PRUNE_DAYS:-7}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS:-7}
      MARIADB_BACKUPS_PATH: ${MARIADB_BACKUPS_PATH:-/srv/gaseous-mariadb/backups}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH:-/srv/gaseous-application-data/backups}
      DATA_PATH: ${DATA_PATH:-/root/.gaseous-server}
      MARIADB_BACKUP_NAME: ${MARIADB_BACKUP_NAME:-gaseous-mariadb-backup}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME:-gaseous-application-data-backup}
    networks:
      - gaseous-server-network
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
