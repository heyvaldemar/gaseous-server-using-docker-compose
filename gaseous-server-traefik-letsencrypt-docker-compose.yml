networks:
  gaseous-server-network:
    external: true
  traefik-network:
    external: true

volumes:
  mariadb-data:
  gaseous-server-data:
  gaseous-server-mariadb-backup:
  gaseous-server-data-backups:
  gaseous-server-database-backups:
  traefik-certificates:

services:
  mariadb:
    image: ${GASEOUS_SERVER_MARIADB_IMAGE_TAG}
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: gaseous
      MARIADB_USER: ${GASEOUS_SERVER_DB_USER}
      MARIADB_PASSWORD: ${GASEOUS_SERVER_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${GASEOUS_SERVER_DB_ADMIN_PASSWORD}
    networks:
      - gaseous-server-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  gaseous-server:
    image: ${GASEOUS_SERVER_IMAGE_TAG}
    volumes:
      - gaseous-server-data:${DATA_PATH}
    environment:
      dbhost: mariadb
      dbuser: ${GASEOUS_SERVER_DB_USER}
      dbpass: ${GASEOUS_SERVER_DB_PASSWORD}
      igdbclientid: ${GASEOUS_SERVER_IGDB_CLIENT_ID}
      igdbclientsecret: ${GASEOUS_SERVER_IGDB_CLIENT_SECRET}
      TZ: ${GASEOUS_SERVER_TIMEZONE}
    networks:
      - gaseous-server-network
      - traefik-network
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/127.0.0.1/80' || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 360s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gaseous-server.rule=Host(`${GASEOUS_SERVER_HOSTNAME}`)"
      - "traefik.http.routers.gaseous-server.service=gaseous-server"
      - "traefik.http.routers.gaseous-server.entrypoints=websecure"
      - "traefik.http.services.gaseous-server.loadbalancer.server.port=80"
      - "traefik.http.routers.gaseous-server.tls=true"
      - "traefik.http.routers.gaseous-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.gaseous-server.loadbalancer.passhostheader=true"
      - "traefik.http.routers.gaseous-server.middlewares=compresstraefik"
      - "traefik.http.middlewares.compresstraefik.compress=true"
      - "traefik.docker.network=traefik-network"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      traefik:
        condition: service_healthy

  traefik:
    image: ${TRAEFIK_IMAGE_TAG}
    command:
      - "--log.level=${TRAEFIK_LOG_LEVEL}"
      - "--accesslog=true"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entryPoints.ping.address=:8082"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme/acme.json"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      - "--global.checkNewVersion=true"
      - "--global.sendAnonymousUsage=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-certificates:/etc/traefik/acme
    networks:
      - traefik-network
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping","--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_HOSTNAME}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.dashboard.loadbalancer.passhostheader=true"
      - "traefik.http.routers.dashboard.middlewares=authtraefik"
      - "traefik.http.middlewares.authtraefik.basicauth.users=${TRAEFIK_BASIC_AUTH}"
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    restart: unless-stopped

  backups:
    image: ${GASEOUS_SERVER_MARIADB_IMAGE_TAG}
    command: >-
      sh -c 'sleep $BACKUP_INIT_SLEEP &&
      while true; do
        mariadb-dump -h mariadb -u $GASEOUS_SERVER_DB_USER -p"$GASEOUS_SERVER_DB_PASSWORD" gaseous | gzip > "$MARIADB_BACKUPS_PATH/$MARIADB_BACKUP_NAME-$(date '+%Y-%m-%d_%H-%M').gz" &&
        tar -zcpf $DATA_BACKUPS_PATH/$DATA_BACKUP_NAME-$(date "+%Y-%m-%d_%H-%M").tar.gz $DATA_PATH &&
        find $MARIADB_BACKUPS_PATH -type f -mtime +$MARIADB_BACKUP_PRUNE_DAYS | xargs rm -f &&
        find $DATA_BACKUPS_PATH -type f -mtime +$DATA_BACKUP_PRUNE_DAYS | xargs rm -f;
        sleep $BACKUP_INTERVAL; done'
    volumes:
      - gaseous-server-mariadb-backup:/var/lib/mysql
      - gaseous-server-data:${DATA_PATH}
      - gaseous-server-data-backups:${DATA_BACKUPS_PATH}
      - gaseous-server-database-backups:${MARIADB_BACKUPS_PATH}
    environment:
      GASEOUS_SERVER_DB_USER: ${GASEOUS_SERVER_DB_USER}
      GASEOUS_SERVER_DB_PASSWORD: ${GASEOUS_SERVER_DB_PASSWORD}
      BACKUP_INIT_SLEEP: ${BACKUP_INIT_SLEEP}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      MARIADB_BACKUP_PRUNE_DAYS: ${MARIADB_BACKUP_PRUNE_DAYS}
      DATA_BACKUP_PRUNE_DAYS: ${DATA_BACKUP_PRUNE_DAYS}
      MARIADB_BACKUPS_PATH: ${MARIADB_BACKUPS_PATH}
      DATA_BACKUPS_PATH: ${DATA_BACKUPS_PATH}
      DATA_PATH: ${DATA_PATH}
      MARIADB_BACKUP_NAME: ${MARIADB_BACKUP_NAME}
      DATA_BACKUP_NAME: ${DATA_BACKUP_NAME}
    networks:
      - gaseous-server-network
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
